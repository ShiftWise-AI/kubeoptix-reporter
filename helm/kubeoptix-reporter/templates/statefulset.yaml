{{- if .Values.deploy.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kubeoptix-reporter.fullname" . }}
  labels:
    {{- include "kubeoptix-reporter.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.api.name }}
  replicas: {{ .Values.scalePolicy.maxReplicas }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "kubeoptix-reporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeoptix-reporter.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeoptix-reporter
          image: {{ include "kubeoptix-reporter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DATA_DIR
              value: {{ .Values.persistence.reportsPath | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.podEnv.LOG_LEVEL | quote }}
            - name: TZ
              value: {{ .Values.podEnv.TZ | quote }}              
          ports:
            - name: http
              containerPort: {{ .Values.service.api.targetPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: app-data
              mountPath: {{ .Values.persistence.mountPath }}     
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
      {{- end }}
{{- end }}
