{{- if and .Values.deploy.enabled .Values.service.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.api.name }}
  labels:
    {{- include "kubeoptix-reporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: {{ .Values.service.api.targetPort }}
      protocol: TCP
  selector:
    {{- include "kubeoptix-reporter.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if and .Values.deploy.enabled .Values.service.headless.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeoptix-reporter.headlessServiceName" . }}
  labels:
    {{- include "kubeoptix-reporter.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.service.headless.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kubeoptix-reporter.selectorLabels" . | nindent 4 }}
{{- end }}
