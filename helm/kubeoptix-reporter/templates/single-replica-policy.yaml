apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kubeoptix-reporter.fullname" . }}
  labels:
    {{- include "kubeoptix-reporter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - statefulsets
          - statefulsets/scale
        scope: Namespaced
  matchConditions:
    - name: application-workload
      expression: >-
        request.namespace == {{ .Release.Namespace | quote }} &&
        request.name == {{ include "kubeoptix-reporter.fullname" . | quote }}
  validations:
    - expression: object.spec.replicas == 1
      message: KubeOptix Reporter must run with exactly one replica.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kubeoptix-reporter.fullname" . }}
  labels:
    {{- include "kubeoptix-reporter.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kubeoptix-reporter.fullname" . }}
  validationActions:
    - Deny