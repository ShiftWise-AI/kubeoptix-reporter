deploy:
  enabled: true

nameOverride: ""
fullnameOverride: ""

build:
  enabled: true
  git:
    uri: https://github.com/ShiftWise-AI/kubeoptix-reporter.git
    ref: main
    sourceSecret: github-auth
  sourceSecret:
    create: false
    username: x-access-token
    token: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

image:
  useBuildOutput: true
  repository: ""
  tag: latest
  pullPolicy: Always

service:
  headless:
    enabled: true
    name: reporter
    port: 8000
  api:
    enabled: true
    name: reporter-api
    type: ClusterIP
    port: 8000
    targetPort: 8000

route:
  enabled: true
  name: reporter
  host: ""
  termination: edge
  insecureEdgeTerminationPolicy: Redirect

scalePolicy:
  enabled: true
  maxReplicas: 1

podEnv:
  TZ: America/Sao_Paulo
  LOG_LEVEL: INFO

persistence:
  enabled: true
  existingClaim: harvester-app-data
  mountPath: /data/reports

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
